name: Build Mastor Reggae Chord Machine MRCM-1240

on:
  push:
    branches: [main]
    paths:
      - 'ReggaeChordMachine/**'
      - 'RiddimBank/Source/**'
      - 'ReggaePiano/Source/RootsKeysEngine.h'
      - 'ReggaePiano/Source/TapeEchoDSP.h'
      - 'ReggaePiano/Source/PluginProcessor.cpp'
      - 'site/chords/**'
      - '.github/workflows/build-reggaechordmachine.yml'
      - '.github/scripts/**'
      - '.github/installer/**'
    tags:
      - 'MRCM-1240-*'
  pull_request:
    paths:
      - 'ReggaeChordMachine/**'
      - 'RiddimBank/Source/**'
      - 'ReggaePiano/Source/RootsKeysEngine.h'
      - 'ReggaePiano/Source/TapeEchoDSP.h'
      - '.github/workflows/build-reggaechordmachine.yml'
      - '.github/scripts/**'
      - '.github/installer/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que deve receber os instaladores (vazio = só compilar)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    working-directory: ReggaeChordMachine

jobs:
  engine-test:
    name: Teste do motor de harmonia (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar e rodar o teste (voicings, padrões, notas presas)
        run: |
          g++ -std=c++17 -O2 -Wall tests/engine_test.cpp -o engine_test
          ./engine_test

      - name: Timbre igual ao do Roots Keys (piano inicial e órgão Roots Percussion)
        working-directory: .
        run: python3 ReggaeChordMachine/tests/check_rootskeys_timbre.py

      - name: Versão de celular (site/chords) gera o mesmo MIDI que o plugin
        working-directory: .
        run: |
          g++ -std=c++17 -O2 -Wall ReggaeChordMachine/tests/dump_loop.cpp -o dump_loop
          node ReggaeChordMachine/tests/web_engine_test.js ./dump_loop

  build:
    needs: engine-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # --- Validação com pluginval (carrega o plugin, processa áudio, testa estado e interface)
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 600000 --validate "build/DubChords_artefacts/Release/VST3/Mastor Reggae Chord Machine MRCM-1240.vst3" 2>&1 | Tee-Object -Variable pvlog
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if ($code -ne 0) { exit 1 }

      # --- Validador oficial da Steinberg (conformidade VST3: Cubase, Studio One, Reaper, Ableton, FL Studio, Bitwig)
      - name: Validate VST3 with Steinberg validator (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          git clone --depth 1 --branch v3.7.14_build_55 https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          cd vst3sdk
          git submodule update --init --depth 1 base pluginterfaces public.sdk cmake
          Set-Content public.sdk/samples/vst-hosting/CMakeLists.txt "add_subdirectory(validator)"
          cmake -B build -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build build --config Release --target validator --parallel 4
          $v = Get-ChildItem -Recurse -Filter validator.exe build | Select-Object -First 1
          & $v.FullName "${{ github.workspace }}/ReggaeChordMachine/build/DubChords_artefacts/Release/VST3/Mastor Reggae Chord Machine MRCM-1240.vst3" 2>&1 | Tee-Object -Variable vlog
          $code = $LASTEXITCODE
          $vlog | Select-String -Pattern "Failed|ERROR" -Context 6,0 | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { Write-Host "validator falhou: $code"; exit 1 }

      - name: Check universal binary + validate (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3="build/DubChords_artefacts/Release/VST3/Mastor Reggae Chord Machine MRCM-1240.vst3"
          BIN="$VST3/Contents/MacOS/Mastor Reggae Chord Machine MRCM-1240"
          echo "== Arquiteturas do binário"; lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64 && lipo -info "$BIN" | grep -q arm64
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 900000 --validate "$VST3"
          echo "== auval (validador da Apple para AU)"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/DubChords_artefacts/Release/AU/Mastor Reggae Chord Machine MRCM-1240.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Dbch Dblb

      - name: Collect + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/DubChords_artefacts/Release/VST3/Mastor Reggae Chord Machine MRCM-1240.vst3" out/
          Copy-Item "build/DubChords_artefacts/Release/Standalone/Mastor Reggae Chord Machine MRCM-1240.exe" out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath ../MRCM-1240-Windows.zip

      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ github.workspace }}/.github/scripts/instalador-windows.ps1 -Origem out -Produto "Mastor Reggae Chord Machine MRCM-1240" -Sigla MRCM-1240 -Saida ../MRCM-1240-Windows-Instalador.exe

      - name: Conferir runtime embutido (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          python "${{ github.workspace }}/.github/scripts/conferir-runtime-windows.py" out

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/DubChords_artefacts/Release/VST3/Mastor Reggae Chord Machine MRCM-1240.vst3" out/
          cp -R "build/DubChords_artefacts/Release/AU/Mastor Reggae Chord Machine MRCM-1240.component" out/
          cp -R "build/DubChords_artefacts/Release/Standalone/Mastor Reggae Chord Machine MRCM-1240.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.app
          cd out && ditto -c -k --sequesterRsrc . ../../MRCM-1240-macOS.zip

      - name: Instalador (macOS)
        if: runner.os == 'macOS'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/instalador-macos.sh" out "Mastor Reggae Chord Machine MRCM-1240" MRCM-1240 ../MRCM-1240-macOS-Instalador.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: MRCM-1240-${{ matrix.name }}
          path: |
            MRCM-1240-${{ matrix.name }}.zip
            MRCM-1240-${{ matrix.name }}-Instalador.*

  # Publica (ou atualiza) a release "Mastor Reggae Chord Machine MRCM-1240 <versão>" com a tag MRCM-1240-<versão>,
  # lendo a versão do CMakeLists.txt. Não vira a "latest", para não mexer nos links dos outros plugins.
  release:
    needs: build
    # LEGADO: o MRCM-1240 virou a aba CHORD MACHINE do Mastor Reggae Piano MRP-80. O código continua compilado e testado
    # (o MRP-80 e o MRM-0420 usam esta pasta), mas a release MRCM-1240-2.4 fica congelada: só sai release por tag manual.
    if: ${{ github.event_name != 'pull_request' && !cancelled() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/MRCM-1240-') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ReggaeChordMachine/RELEASE_NOTES.md
            ReggaeChordMachine/CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Versão
        id: ver
        run: |
          V=$(sed -n 's/^project(DubChords VERSION \([0-9]*\.[0-9]*\).*/\1/p' ReggaeChordMachine/CMakeLists.txt)
          echo "Versão do MRCM-1240: $V"
          test -n "$V"
          echo "tag=MRCM-1240-$V" >> "$GITHUB_OUTPUT"
          echo "name=Mastor Reggae Chord Machine MRCM-1240 $V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: MRCM-1240-*
          merge-multiple: true

      - name: Conferir os arquivos
        run: |
          ls -la dist
          test -n "$(ls dist/*.zip 2>/dev/null)"
          test -n "$(ls dist/*-Instalador.exe 2>/dev/null)"
          test -n "$(ls dist/*-Instalador.pkg 2>/dev/null)"
          # o plugin do Windows não pode depender do Visual C++ Redistributable (senão não abre em PCs sem ele)
          d=$(mktemp -d); unzip -q dist/*-Windows.zip -d "$d"
          dll=$(find "$d" -path '*x86_64-win*' -type f | head -1)
          if objdump -p "$dll" | grep -iE 'DLL Name: (VCRUNTIME|MSVCP)'; then echo "::error::plugin depende do runtime do Visual C++"; exit 1; fi

      # release de outra coisa (evento release ou tag informada): só anexa os instaladores
      - if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: |
            dist/*.zip
            dist/*-Instalador.exe
            dist/*-Instalador.pkg

      # push na main ou tag MRCM-1240-*: release própria com nome e notas da versão
      - if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.tag) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.name }}
          files: |
            dist/*.zip
            dist/*-Instalador.exe
            dist/*-Instalador.pkg
          body_path: ReggaeChordMachine/RELEASE_NOTES.md
          prerelease: false
          make_latest: 'false'
