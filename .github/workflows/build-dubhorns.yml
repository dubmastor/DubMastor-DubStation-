name: Build Mastor Dub Horns MDH-70

# A cada push em DubHorns/ no main: testa o motor, compila Windows + Mac, valida com
# pluginval/auval e publica a release "MDH-70-<versão>" (versão lida de Source/Version.h).
# A release NÃO vira a "latest", para não mexer nos links de download dos outros plugins.
on:
  push:
    branches: [main]
    paths:
      - 'DubHorns/**'
      - '.github/workflows/build-dubhorns.yml'
      - '.github/scripts/**'
      - '.github/installer/**'
  pull_request:
    paths:
      - 'DubHorns/**'
      - '.github/workflows/build-dubhorns.yml'
      - '.github/scripts/**'
      - '.github/installer/**'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: DubHorns

jobs:
  engine-test:
    name: Teste do motor (offline)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Ler a versão
        run: echo "version=$(grep -oE '"[0-9.]+"' Source/Version.h | tr -d '"')" >> "$GITHUB_OUTPUT"
      - name: Compilar e rodar o teste (harmonia, frases, naipe, Tape Echo, estabilidade)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra tests/engine_test.cpp -o engine_test
          ./engine_test

  build:
    needs: engine-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 600000 --validate "build/MastorDubHorns_artefacts/Release/VST3/Mastor Dub Horns MDH-70.vst3" 2>&1 | Tee-Object -Variable pvlog
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if ($code -ne 0) { exit 1 }

      - name: Check universal binary + validate (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3="build/MastorDubHorns_artefacts/Release/VST3/Mastor Dub Horns MDH-70.vst3"
          BIN="$VST3/Contents/MacOS/Mastor Dub Horns MDH-70"
          echo "== Arquiteturas do binário"; lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64 && lipo -info "$BIN" | grep -q arm64
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 900000 --validate "$VST3"
          echo "== auval (validador da Apple para AU)"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/MastorDubHorns_artefacts/Release/AU/Mastor Dub Horns MDH-70.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Dbhn Dblb

      - name: Collect + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/MastorDubHorns_artefacts/Release/VST3/Mastor Dub Horns MDH-70.vst3" out/
          Copy-Item "build/MastorDubHorns_artefacts/Release/Standalone/Mastor Dub Horns MDH-70.exe" out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath ../MDH-70-Windows.zip

      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ github.workspace }}/.github/scripts/instalador-windows.ps1 -Origem out -Produto "Mastor Dub Horns MDH-70" -Sigla MDH-70 -Saida ../MDH-70-Windows-Instalador.exe

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/MastorDubHorns_artefacts/Release/VST3/Mastor Dub Horns MDH-70.vst3" out/
          cp -R "build/MastorDubHorns_artefacts/Release/AU/Mastor Dub Horns MDH-70.component" out/
          cp -R "build/MastorDubHorns_artefacts/Release/Standalone/Mastor Dub Horns MDH-70.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.app
          cd out && ditto -c -k --sequesterRsrc . ../../MDH-70-macOS.zip

      - name: Instalador (macOS)
        if: runner.os == 'macOS'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/instalador-macos.sh" out "Mastor Dub Horns MDH-70" MDH-70 ../MDH-70-macOS-Instalador.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: MDH-70-${{ matrix.name }}
          path: |
            MDH-70-${{ matrix.name }}.zip
            MDH-70-${{ matrix.name }}-Instalador.*

  # publica (ou atualiza) a release da versão atual com os zips que passaram na validação
  release:
    needs: [engine-test, build]
    if: ${{ github.event_name != 'pull_request' && !cancelled() && needs.engine-test.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: DubHorns/RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Conferir os arquivos
        run: |
          ls -la dist
          test -n "$(ls dist/*.zip 2>/dev/null)"
          test -n "$(ls dist/*-Instalador.exe 2>/dev/null)"
          test -n "$(ls dist/*-Instalador.pkg 2>/dev/null)"
          # o plugin do Windows não pode depender do Visual C++ Redistributable (senão não abre em PCs sem ele)
          d=$(mktemp -d); unzip -q dist/*-Windows.zip -d "$d"
          dll=$(find "$d" -path '*x86_64-win*' -type f | head -1)
          if objdump -p "$dll" | grep -iE 'DLL Name: (VCRUNTIME|MSVCP)'; then echo "::error::plugin depende do runtime do Visual C++"; exit 1; fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: MDH-70-${{ needs.engine-test.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mastor Dub Horns MDH-70 ${{ needs.engine-test.outputs.version }}
          body_path: DubHorns/RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/*-Instalador.exe
            dist/*-Instalador.pkg
          make_latest: 'false'
          overwrite_files: true
