name: Site de downloads (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # depois de cada build de plugin: se a release ainda não tiver os instaladores, o site serve os do build (site/downloads)
  workflow_run:
    workflows:
      - 'Build Mastor Big Knob MBK-76'
      - 'Build Mastor Reggae Drums MRD-12'
      - 'Build Mastor Dub Horns MDH-70'
      - 'Build Dub Station — instalador completo'
      - 'Build Mastor Phone Vox MPV-01'
      - 'Build Mastor Reggae Bass Machine MRBM-69'
      - 'Build Mastor Reggae Chord Machine MRCM-1240'
      - 'Build Mastor Reggae Drum Machine MRDM-12'
      - 'Build Mastor Reggae Bass MRB-69'
      - 'Build Mastor Riddim Machine MRM-0420'
      - 'Build Mastor Roots Keys MRK-80'
      - 'Build Mastor Tape Echo MTE-12'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Link de release que ainda não existe (o Actions pode não ter permissão de criar release):
      # o site serve o instalador do último build da main e esconde o zip que faltar.
      - name: Instaladores sem release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/links-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # o deploy às vezes não acha o artefato "github-pages" logo após o upload
      # (atraso do próprio GitHub); espera e tenta de novo antes de falhar
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
