name: Build DubMastor Dub Chords

on:
  push:
    branches: [main]
    paths:
      - 'DubChords/**'
      - '.github/workflows/build-dubchords.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que deve receber os instaladores (vazio = só compilar)'
        required: false
        default: ''
      prerelease:
        description: 'Publicar como pré-release de teste (não vira a "latest", não mexe nos links dos outros plugins)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: DubChords

jobs:
  engine-test:
    name: Teste do motor de harmonia (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar e rodar o teste (voicings, padrões, notas presas)
        run: |
          g++ -std=c++17 -O2 -Wall tests/engine_test.cpp -o engine_test
          ./engine_test

  build:
    needs: engine-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # --- Validação com pluginval (carrega o plugin, processa áudio, testa estado e interface)
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 600000 --validate "build/DubChords_artefacts/Release/VST3/DubMastor Dub Chords.vst3" 2>&1 | Tee-Object -Variable pvlog
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if ($code -ne 0) { exit 1 }

      - name: Check universal binary + validate (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3="build/DubChords_artefacts/Release/VST3/DubMastor Dub Chords.vst3"
          BIN="$VST3/Contents/MacOS/DubMastor Dub Chords"
          echo "== Arquiteturas do binário"; lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64 && lipo -info "$BIN" | grep -q arm64
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 900000 --validate "$VST3"
          echo "== auval (validador da Apple para AU)"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/DubChords_artefacts/Release/AU/DubMastor Dub Chords.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Dbch Dblb

      - name: Collect + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/DubChords_artefacts/Release/VST3/DubMastor Dub Chords.vst3" out/
          Copy-Item "build/DubChords_artefacts/Release/Standalone/DubMastor Dub Chords.exe" out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath ../DubMastorDubChords-Windows.zip

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/DubChords_artefacts/Release/VST3/DubMastor Dub Chords.vst3" out/
          cp -R "build/DubChords_artefacts/Release/AU/DubMastor Dub Chords.component" out/
          cp -R "build/DubChords_artefacts/Release/Standalone/DubMastor Dub Chords.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.app
          cd out && ditto -c -k --sequesterRsrc . ../../DubMastorDubChords-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DubMastorDubChords-${{ matrix.name }}
          path: DubMastorDubChords-${{ matrix.name }}.zip

  release:
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'release' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: DubChords/RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: dist/*.zip
          prerelease: ${{ inputs.prerelease == true }}
          make_latest: ${{ inputs.prerelease == true && 'false' || 'legacy' }}
          body_path: ${{ inputs.prerelease == true && 'DubChords/RELEASE_NOTES.md' || '' }}
          name: ${{ inputs.prerelease == true && 'Dub Chords 1.0 (teste)' || '' }}
