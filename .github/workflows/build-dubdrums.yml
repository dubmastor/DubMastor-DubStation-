name: Build Mastor Dub Drums Machine MDDM-12

on:
  push:
    branches: [main]
    paths:
      - 'DubDrums/**'
      - 'site/drums/generator.js'
      - '.github/workflows/build-dubdrums.yml'
    tags:
      - 'MDDM-12-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que deve receber os instaladores (vazio = só compilar)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    working-directory: DubDrums

jobs:
  render-test:
    name: Teste offline (gerador, interface, MIDI e som do preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
                                  libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev

      - name: Teste do gerador (estilos, bateristas, viradas, intro)
        run: |
          g++ -std=c++17 -O2 -Wall -ISource Source/PatternGenerator.cpp tests/test_generator.cpp -o test_generator
          ./test_generator

      - name: Versão do navegador/celular toca igual ao plugin (site/drums/generator.js x C++)
        run: |
          g++ -std=c++17 -O2 -ISource Source/PatternGenerator.cpp tests/dump_patterns.cpp -o dump_patterns
          ./dump_patterns > padroes.jsonl
          node tests/web_generator_test.js padroes.jsonl

      - name: Interface, MIDI exportado e áudio do preview, sem DAW
        run: |
          cmake -B build-test -DCMAKE_BUILD_TYPE=Release -DDD_FORMATS=VST3 -DDD_RENDER_PREVIEW=ON -DJUCE_DIR="${{ github.workspace }}/JUCE"
          cmake --build build-test --target render_preview --parallel 4
          mkdir -p test-out
          R=./build-test/render_preview_artefacts/Release/render_preview
          $R test-out/interface.png 0 4 42 intro 2
          $R test-out/notas.png 0 4 42 notas 0
          $R test-out/preview-carlton.wav 0 2 42 intro 2
          $R test-out/preview-scott.wav 2 2 42 intro 0
          $R test-out/preview-santa.wav 0 2 42 intro 1
          $R test-out/preview-digital.wav 1 2 42 intro 0 1
          $R test-out/onedrop-intro.mid 0 4 42 intro 2
          $R test-out/sly.png 0 4 7 editado 3
          $R test-out/preview-sly.wav 0 2 42 x 3
          $R test-out/preview-digikal-mt40.wav 0 2 43 x 4 1
          $R test-out/preview-digikal-dmx.wav 0 2 44 x 4 0
          # troca de variação / baterista / swing tocando: nenhuma nota pode sair dobrada
          $R test-out/troca.txt 0 4 5

      - uses: actions/upload-artifact@v4
        with:
          name: DubDrums-teste
          path: DubDrums/test-out

  build:
    needs: render-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # --- Validação com pluginval (carrega o plugin, processa áudio, testa estado e interface)
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # nível 10 (o mais rigoroso): estado, automação, buses, tempo real, várias taxas e tamanhos de bloco
          ./pluginval/pluginval.exe --strictness-level 10 --timeout-ms 900000 --validate "build/DubDrums_artefacts/Release/VST3/Mastor Dub Drums Machine MDDM-12.vst3" 2>&1 | Tee-Object -Variable pvlog
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if ($code -ne 0) { exit 1 }

      # --- Validador oficial da Steinberg (o mesmo teste de conformidade VST3 usado por Cubase, Studio One,
      #     Reaper, Ableton Live, FL Studio e Bitwig para carregar plugins VST3)
      - name: Validate VST3 with Steinberg validator (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          git clone --depth 1 --branch v3.7.14_build_55 https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          cd vst3sdk
          git submodule update --init --depth 1 base pluginterfaces public.sdk cmake
          cmake -B build -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ADD_VSTGUI=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build build --config Release --target validator --parallel 4
          $v = Get-ChildItem -Recurse -Filter validator.exe build | Select-Object -First 1
          & $v.FullName "${{ github.workspace }}/DubDrums/build/DubDrums_artefacts/Release/VST3/Mastor Dub Drums Machine MDDM-12.vst3" 2>&1 | Tee-Object -Variable vlog | Select-Object -Last 40
          if ($LASTEXITCODE -ne 0) { Write-Host "validator falhou: $LASTEXITCODE"; exit 1 }

      - name: Check universal binary + validate (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3="build/DubDrums_artefacts/Release/VST3/Mastor Dub Drums Machine MDDM-12.vst3"
          BIN="$VST3/Contents/MacOS/Mastor Dub Drums Machine MDDM-12"
          echo "== Arquiteturas do binário"; lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64 && lipo -info "$BIN" | grep -q arm64
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --timeout-ms 1200000 --validate "$VST3"
          echo "== auval (validador da Apple para AU: Logic, GarageBand, Ableton e outros no Mac)"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/DubDrums_artefacts/Release/AU/Mastor Dub Drums Machine MDDM-12.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Dbd1 Dblb
          echo "== pluginval no AU (o formato que o Logic usa)"
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --timeout-ms 1200000 --validate ~/Library/Audio/Plug-Ins/Components/"Mastor Dub Drums Machine MDDM-12.component"

      - name: Collect + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/DubDrums_artefacts/Release/VST3/Mastor Dub Drums Machine MDDM-12.vst3" out/
          Copy-Item "build/DubDrums_artefacts/Release/Standalone/Mastor Dub Drums Machine MDDM-12.exe" out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath ../MastorDubDrumsMachine-Windows.zip

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/DubDrums_artefacts/Release/VST3/Mastor Dub Drums Machine MDDM-12.vst3" out/
          cp -R "build/DubDrums_artefacts/Release/AU/Mastor Dub Drums Machine MDDM-12.component" out/
          cp -R "build/DubDrums_artefacts/Release/Standalone/Mastor Dub Drums Machine MDDM-12.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.app
          cd out && ditto -c -k --sequesterRsrc . ../../MastorDubDrumsMachine-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MastorDubDrumsMachine-${{ matrix.name }}
          path: MastorDubDrumsMachine-${{ matrix.name }}.zip

  # Release própria do Mastor Dub Drums Machine MDDM-12: MDDM-12-<versão do CMakeLists>, criada/atualizada a cada push
  # na main que mexa no MDDM-12 (ou por tag MDDM-12-x.y). Não vira a "latest", para não mexer
  # nos links /releases/latest/download dos outros plugins.
  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/MDDM-12-') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DubDrums/RELEASE_NOTES.md
            DubDrums/CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Versão
        id: ver
        run: |
          V=$(sed -n 's/^project(DubDrums VERSION \([0-9]*\.[0-9]*\).*/\1/p' DubDrums/CMakeLists.txt)
          echo "Versão do MDDM-12: $V"
          test -n "$V"
          echo "tag=MDDM-12-$V" >> "$GITHUB_OUTPUT"
          echo "name=Mastor Dub Drums Machine MDDM-12 $V" >> "$GITHUB_OUTPUT"

      # apaga rascunhos do MDDM-12 criados com tag inválida (nome com espaços) pela 1.3
      - name: Limpa rascunhos quebrados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq '.[] | select(.draft and (.tag_name | startswith("Mastor Dub Drums Machine"))) | .id'); do
            echo "Apagando rascunho $id"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
          done

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: MastorDubDrumsMachine-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.name }}
          files: dist/*.zip
          body_path: DubDrums/RELEASE_NOTES.md
          make_latest: 'false'
