name: Build DubMastor Dub Drums

on:
  push:
    branches: [main]
    paths:
      - 'DubDrums/**'
      - '.github/workflows/build-dubdrums.yml'
    tags:
      - 'DubDrums-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que deve receber os instaladores (vazio = só compilar)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    working-directory: DubDrums

jobs:
  render-test:
    name: Teste offline (gerador, interface, MIDI e som do preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
                                  libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev

      - name: Teste do gerador (estilos, bateristas, viradas, intro)
        run: |
          g++ -std=c++17 -O2 -Wall -ISource Source/PatternGenerator.cpp tests/test_generator.cpp -o test_generator
          ./test_generator

      - name: Interface, MIDI exportado e áudio do preview, sem DAW
        run: |
          cmake -B build-test -DCMAKE_BUILD_TYPE=Release -DDD_FORMATS=VST3 -DDD_RENDER_PREVIEW=ON -DJUCE_DIR="${{ github.workspace }}/JUCE"
          cmake --build build-test --target render_preview --parallel 4
          mkdir -p test-out
          R=./build-test/render_preview_artefacts/Release/render_preview
          $R test-out/interface.png 0 4 42 intro 2
          $R test-out/notas.png 0 4 42 notas 0
          $R test-out/preview-carlton.wav 0 2 42 intro 2
          $R test-out/preview-scott.wav 2 2 42 intro 0
          $R test-out/onedrop-intro.mid 0 4 42 intro 2

      - uses: actions/upload-artifact@v4
        with:
          name: DubDrums-teste
          path: DubDrums/test-out

  build:
    needs: render-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # --- Validação com pluginval (carrega o plugin, processa áudio, testa estado e interface)
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 600000 --validate "build/DubDrums_artefacts/Release/VST3/DubMastor Dub Drums.vst3" 2>&1 | Tee-Object -Variable pvlog
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if ($code -ne 0) { exit 1 }

      - name: Check universal binary + validate (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3="build/DubDrums_artefacts/Release/VST3/DubMastor Dub Drums.vst3"
          BIN="$VST3/Contents/MacOS/DubMastor Dub Drums"
          echo "== Arquiteturas do binário"; lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64 && lipo -info "$BIN" | grep -q arm64
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 900000 --validate "$VST3"
          echo "== auval (validador da Apple para AU)"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/DubDrums_artefacts/Release/AU/DubMastor Dub Drums.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Dbd1 Dblb

      - name: Collect + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/DubDrums_artefacts/Release/VST3/DubMastor Dub Drums.vst3" out/
          Copy-Item "build/DubDrums_artefacts/Release/Standalone/DubMastor Dub Drums.exe" out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath ../DubMastorDubDrums-Windows.zip

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/DubDrums_artefacts/Release/VST3/DubMastor Dub Drums.vst3" out/
          cp -R "build/DubDrums_artefacts/Release/AU/DubMastor Dub Drums.component" out/
          cp -R "build/DubDrums_artefacts/Release/Standalone/DubMastor Dub Drums.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.app
          cd out && ditto -c -k --sequesterRsrc . ../../DubMastorDubDrums-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DubMastorDubDrums-${{ matrix.name }}
          path: DubMastorDubDrums-${{ matrix.name }}.zip

  # Release própria do Dub Drums: DubDrums-<versão do CMakeLists>, criada/atualizada a cada push
  # na main que mexa no Dub Drums (ou por tag DubDrums-x.y). Não vira a "latest", para não mexer
  # nos links /releases/latest/download dos outros plugins.
  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/DubDrums-') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DubDrums/RELEASE_NOTES.md
            DubDrums/CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Versão
        id: ver
        run: |
          V=$(sed -n 's/^project(DubDrums VERSION \([0-9]*\.[0-9]*\).*/\1/p' DubDrums/CMakeLists.txt)
          echo "Versão do Dub Drums: $V"
          test -n "$V"
          echo "tag=DubDrums-$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: DubMastorDubDrums-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          files: dist/*.zip
          body_path: DubDrums/RELEASE_NOTES.md
          make_latest: 'false'
