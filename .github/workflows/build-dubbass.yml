name: Build Dub Bass - Dub Station

on:
  push:
    branches: [main]
    paths:
      - 'DubBass/**'
      - '.github/workflows/build-dubbass.yml'
    tags:
      - 'DubBass-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que deve receber os instaladores (vazio = só compilar)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    working-directory: DubBass

jobs:
  render-test:
    name: Teste offline (áudio, teto do maximizer, estado e interface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
                                  libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev

      - name: Compilar e rodar o teste
        run: |
          cmake -B build-test -DCMAKE_BUILD_TYPE=Release -DDUBBASS_TESTS=ON -DJUCE_DIR="${{ github.workspace }}/JUCE"
          cmake --build build-test --target DubBassTest --parallel 4
          ./build-test/DubBassTest_artefacts/Release/DubBassTest test-out

      - uses: actions/upload-artifact@v4
        with:
          name: DubBass-teste
          path: DubBass/test-out

  build:
    needs: render-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # --- Validação com pluginval (carrega o plugin, processa áudio, testa estado e interface)
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 600000 --validate "build/DubBass_artefacts/Release/VST3/Dub Bass - Dub Station.vst3" 2>&1 | Tee-Object -Variable pvlog
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if ($code -ne 0) { exit 1 }

      - name: Check universal binary + validate (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3="build/DubBass_artefacts/Release/VST3/Dub Bass - Dub Station.vst3"
          BIN="$VST3/Contents/MacOS/Dub Bass - Dub Station"
          echo "== Arquiteturas do binário"; lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64 && lipo -info "$BIN" | grep -q arm64
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 900000 --validate "$VST3"
          echo "== auval (validador da Apple para AU)"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/DubBass_artefacts/Release/AU/Dub Bass - Dub Station.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Dbbs Dblb

      - name: Collect + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/DubBass_artefacts/Release/VST3/Dub Bass - Dub Station.vst3" out/
          Copy-Item "build/DubBass_artefacts/Release/Standalone/Dub Bass - Dub Station.exe" out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath ../DubBass-Windows.zip

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/DubBass_artefacts/Release/VST3/Dub Bass - Dub Station.vst3" out/
          cp -R "build/DubBass_artefacts/Release/AU/Dub Bass - Dub Station.component" out/
          cp -R "build/DubBass_artefacts/Release/Standalone/Dub Bass - Dub Station.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.app
          cd out && ditto -c -k --sequesterRsrc . ../../DubBass-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DubBass-${{ matrix.name }}
          path: DubBass-${{ matrix.name }}.zip

  # Release própria do Dub Bass: DubBass-<versão do CMakeLists>, criada/atualizada a cada push
  # na main que mexa no Dub Bass (ou por tag DubBass-x.y). Não vira a "latest", para não mexer
  # nos links /releases/latest/download dos outros plugins.
  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/DubBass-') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DubBass/RELEASE_NOTES.md
            DubBass/CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Versão
        id: ver
        run: |
          V=$(sed -n 's/^project(DubBass VERSION \([0-9]*\.[0-9]*\).*/\1/p' DubBass/CMakeLists.txt)
          echo "Versão do Dub Bass: $V"
          test -n "$V"
          echo "tag=DubBass-$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: DubBass-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          files: dist/*.zip
          body_path: DubBass/RELEASE_NOTES.md
          make_latest: 'false'
