name: Build DubMastor Roots Keys

on:
  push:
    branches: [main]
    paths:
      - 'RootsKeys/**'
      - '.github/workflows/build-rootskeys.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que deve receber os instaladores (vazio = só compilar)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    working-directory: RootsKeys

jobs:
  dsp-test:
    name: Teste do DSP (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar e rodar o teste do DSP (piano, órgão, eco, maximizer)
        run: |
          g++ -std=c++17 -O2 -Wall tests/render_demo.cpp -o render_demo
          mkdir -p out && cd out && ../render_demo

  build:
    needs: dsp-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # --- Validação com pluginval (carrega o plugin, processa áudio, testa estado e interface)
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 600000 --validate "build/RootsKeys_artefacts/Release/VST3/DubMastor Roots Keys.vst3" 2>&1 | Tee-Object -Variable pvlog
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if ($code -ne 0) { exit 1 }

      - name: Check universal binary + validate (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3="build/RootsKeys_artefacts/Release/VST3/DubMastor Roots Keys.vst3"
          BIN="$VST3/Contents/MacOS/DubMastor Roots Keys"
          echo "== Arquiteturas do binário"; lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64 && lipo -info "$BIN" | grep -q arm64
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 900000 --validate "$VST3"
          echo "== auval (validador da Apple para AU)"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/RootsKeys_artefacts/Release/AU/DubMastor Roots Keys.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Rtky Dblb

      - name: Collect + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/RootsKeys_artefacts/Release/VST3/DubMastor Roots Keys.vst3" out/
          Copy-Item "build/RootsKeys_artefacts/Release/Standalone/DubMastor Roots Keys.exe" out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath ../DubMastorRootsKeys-Windows.zip

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/RootsKeys_artefacts/Release/VST3/DubMastor Roots Keys.vst3" out/
          cp -R "build/RootsKeys_artefacts/Release/AU/DubMastor Roots Keys.component" out/
          cp -R "build/RootsKeys_artefacts/Release/Standalone/DubMastor Roots Keys.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.app
          cd out && ditto -c -k --sequesterRsrc . ../../DubMastorRootsKeys-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DubMastorRootsKeys-${{ matrix.name }}
          path: DubMastorRootsKeys-${{ matrix.name }}.zip

  release:
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'release' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Releases "RootsKeys-x.y" são do Roots Keys: não viram a "latest" (não mexem nos links dos outros plugins)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: dist/*.zip
          make_latest: ${{ startsWith(inputs.tag, 'RootsKeys-') && 'false' || 'legacy' }}
          body_path: ${{ startsWith(inputs.tag, 'RootsKeys-') && 'RootsKeys/RELEASE_NOTES.md' || '' }}
