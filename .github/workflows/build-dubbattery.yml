name: Build Dub Battery Reggae DBR

# O DUB BATTERY REGGAE usa o código do Dub Drums (MRDM-12) direto da pasta dele:
# quando o Dub Drums muda, o Battery é recompilado e testado também.
on:
  push:
    branches: [main]
    paths:
      - 'DubBattery/**'
      - 'DubDrums/Source/**'
      - '.github/workflows/build-dubbattery.yml'
    tags:
      - 'DBR-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que deve receber os instaladores (vazio = só compilar)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    working-directory: DubBattery

jobs:
  render-test:
    name: Teste offline (abas, 16 pads, groove, choke, estado e presets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
                                  libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev

      - name: Compilar o teste
        run: |
          cmake -B build-test -DCMAKE_BUILD_TYPE=Release -DDBR_FORMATS=VST3 -DDBR_RENDER_TEST=ON -DJUCE_DIR="${{ github.workspace }}/JUCE"
          cmake --build build-test --target dbr_render --parallel 4

      - name: Rodar o teste
        run: |
          mkdir -p test-out && cd test-out
          R=../build-test/dbr_render_artefacts/Release/dbr_render
          $R battery.png 0
          $R dubdrums.png 1
          $R pads.wav
          $R groove.wav
          $R choke
          $R estado
          $R presets
          $R daws
          $R layer

      - uses: actions/upload-artifact@v4
        with:
          name: DBR-teste
          path: DubBattery/test-out

  build:
    needs: render-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # --- Validação com pluginval (carrega o plugin, processa áudio, testa estado e interface)
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --timeout-ms 900000 --validate "build/DubBatteryReggae_artefacts/Release/VST3/Dub Battery Reggae.vst3" 2>&1 | Tee-Object -Variable pvlog
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if ($code -ne 0) { exit 1 }

      # --- Validador oficial da Steinberg (conformidade VST3: Cubase, Studio One, Reaper, Ableton, FL Studio, Bitwig)
      - name: Validate VST3 with Steinberg validator (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          git clone --depth 1 --branch v3.7.14_build_55 https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          cd vst3sdk
          git submodule update --init --depth 1 base pluginterfaces public.sdk cmake
          Set-Content public.sdk/samples/vst-hosting/CMakeLists.txt "add_subdirectory(validator)"
          cmake -B build -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build build --config Release --target validator --parallel 4
          $v = Get-ChildItem -Recurse -Filter validator.exe build | Select-Object -First 1
          & $v.FullName "${{ github.workspace }}/DubBattery/build/DubBatteryReggae_artefacts/Release/VST3/Dub Battery Reggae.vst3" 2>&1 | Tee-Object -Variable vlog
          $code = $LASTEXITCODE
          $vlog | Select-String -Pattern "Failed|ERROR" -Context 6,0 | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { Write-Host "validator falhou: $code"; exit 1 }

      - name: Check universal binary + validate (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3="build/DubBatteryReggae_artefacts/Release/VST3/Dub Battery Reggae.vst3"
          BIN="$VST3/Contents/MacOS/Dub Battery Reggae"
          echo "== Arquiteturas do binário"; lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64 && lipo -info "$BIN" | grep -q arm64
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --timeout-ms 1200000 --validate "$VST3"
          echo "== auval (validador da Apple para AU)"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/DubBatteryReggae_artefacts/Release/AU/Dub Battery Reggae.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Dbr1 Dblb

      - name: Collect + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/DubBatteryReggae_artefacts/Release/VST3/Dub Battery Reggae.vst3" out/
          Copy-Item "build/DubBatteryReggae_artefacts/Release/Standalone/Dub Battery Reggae.exe" out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath ../DubBatteryReggae-Windows.zip

      # Instalador .exe (Inno Setup): VST3 em C:\Program Files\Common Files\VST3 + standalone opcional
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(DubBatteryReggae VERSION (\d+\.\d+)').Matches[0].Groups[1].Value
          Write-Host "Versão do instalador: $v"
          & $iscc "/DAppVersion=$v" installer/DBR.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item DubBatteryReggae-Windows-Instalador.exe ../

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/DubBatteryReggae_artefacts/Release/VST3/Dub Battery Reggae.vst3" out/
          cp -R "build/DubBatteryReggae_artefacts/Release/AU/Dub Battery Reggae.component" out/
          cp -R "build/DubBatteryReggae_artefacts/Release/Standalone/Dub Battery Reggae.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.app
          (cd out && ditto -c -k --sequesterRsrc . ../../DubBatteryReggae-macOS.zip)

          # Instalador .pkg: VST3 e AU em /Library/Audio/Plug-Ins (todas as DAWs, Logic e GarageBand
          # incluídos) e o app em /Applications; o postinstall tira a quarentena e relê os Audio Units
          V=$(sed -n 's/^project(DubBatteryReggae VERSION \([0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Library/Audio/Plug-Ins/Components pkgroot/Applications
          cp -R out/*.vst3 pkgroot/Library/Audio/Plug-Ins/VST3/
          cp -R out/*.component pkgroot/Library/Audio/Plug-Ins/Components/
          cp -R out/*.app pkgroot/Applications/
          # sem "relocate": se existir outra cópia do plugin no disco (zip descompactado, pasta de build),
          # o macOS instalaria em cima dela em vez de em /Library/Audio/Plug-Ins
          pkgbuild --analyze --root pkgroot component.plist
          plutil -convert xml1 component.plist
          sed -i '' -e '/<key>BundleIsRelocatable<\/key>/{n;s/<true\/>/<false\/>/;}' component.plist
          echo "== bundles sem relocate:"; grep -A1 "BundleIsRelocatable" component.plist
          ! grep -A1 "BundleIsRelocatable" component.plist | grep -q "<true/>"
          pkgbuild --root pkgroot --component-plist component.plist --identifier com.dubmastor.dubbatteryreggae.pkg --version "$V" \
                   --scripts installer/macos-scripts --install-location / \
                   ../DubBatteryReggae-macOS-Instalador.pkg
          pkgutil --payload-files ../DubBatteryReggae-macOS-Instalador.pkg | grep -E "\.vst3$|\.component$|\.app$"
          # confere o pacote: assinatura do plugin e binário universal dentro do .pkg
          codesign --verify --deep --strict out/*.vst3 out/*.component
          lipo -info "out/Dub Battery Reggae.component/Contents/MacOS/Dub Battery Reggae"
          # instala o .pkg de verdade e confere o que a DAW vai achar
          sudo installer -pkg ../DubBatteryReggae-macOS-Instalador.pkg -target /
          ls -la /Library/Audio/Plug-Ins/VST3 /Library/Audio/Plug-Ins/Components | grep -i battery || true
          test -d "/Library/Audio/Plug-Ins/VST3/Dub Battery Reggae.vst3"
          test -d "/Library/Audio/Plug-Ins/Components/Dub Battery Reggae.component"
          ! xattr -p com.apple.quarantine "/Library/Audio/Plug-Ins/VST3/Dub Battery Reggae.vst3" 2>/dev/null
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Dbr1 Dblb

      - uses: actions/upload-artifact@v4
        with:
          name: DubBatteryReggae-${{ matrix.name }}
          path: |
            DubBatteryReggae-${{ matrix.name }}.zip
            DubBatteryReggae-${{ matrix.name }}-Instalador.*

  # Release própria: DBR-<versão do CMakeLists>, criada/atualizada a cada push na main que mexa
  # no DUB BATTERY REGGAE (ou por tag DBR-x.y). Não vira a "latest", para não mexer nos links
  # /releases/latest/download dos outros plugins.
  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/DBR-') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DubBattery/RELEASE_NOTES.md
            DubBattery/CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Versão
        id: ver
        run: |
          V=$(sed -n 's/^project(DubBatteryReggae VERSION \([0-9]*\.[0-9]*\).*/\1/p' DubBattery/CMakeLists.txt)
          echo "Versão do DUB BATTERY REGGAE: $V"
          test -n "$V"
          echo "tag=DBR-$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: DubBatteryReggae-*
          merge-multiple: true

      - name: Só os instaladores
        run: ls dist && rm -f dist/*.png dist/*.wav dist/*.mid

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('Dub Battery Reggae {0}', steps.ver.outputs.tag) }}
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.pkg
          body_path: DubBattery/RELEASE_NOTES.md
          make_latest: 'false'
