name: Build Mastor Big Knob MBK-76

on:
  push:
    branches: [main]
    paths:
      - 'BigKnob/**'
      - '.github/workflows/build-bigknob.yml'
      - '.github/scripts/**'
      - '.github/installer/**'
    tags:
      - 'MBK-76-*'
  pull_request:
    paths:
      - 'BigKnob/**'
      - '.github/workflows/build-bigknob.yml'
      - '.github/scripts/**'
      - '.github/installer/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que deve receber os instaladores (vazio = só compilar)'
        required: false
        default: ''

# só o build mais novo de cada branch / PR roda: um push novo cancela o anterior (economiza as máquinas Mac)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: BigKnob

jobs:
  dsp-test:
    name: Teste do DSP (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar e rodar o teste (filtro, eco, maximizer)
        run: |
          g++ -std=c++17 -O2 -Wall tests/render_demo.cpp -o render_demo
          ./render_demo

  build:
    needs: dsp-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # --- Validação com pluginval (carrega o plugin, processa áudio, testa estado e interface)
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 600000 --validate "build/DubKnob_artefacts/Release/VST3/Mastor Big Knob MBK-76.vst3" 2>&1 | Tee-Object -Variable pvlog
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if ($code -ne 0) { exit 1 }

      - name: Check universal binary + validate (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3="build/DubKnob_artefacts/Release/VST3/Mastor Big Knob MBK-76.vst3"
          BIN="$VST3/Contents/MacOS/Mastor Big Knob MBK-76"
          echo "== Arquiteturas do binário"; lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64 && lipo -info "$BIN" | grep -q arm64
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=./pluginval.app/Contents/MacOS/pluginval
          echo "== pluginval VST3, nível máximo"
          $PV --strictness-level 10 --timeout-ms 900000 --validate "$VST3"
          echo "== auval (validador oficial da Apple para AU)"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/DubKnob_artefacts/Release/AU/Mastor Big Knob MBK-76.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aufx Dbkn Dblb

      - name: Collect + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/DubKnob_artefacts/Release/VST3/Mastor Big Knob MBK-76.vst3" out/
          Copy-Item "build/DubKnob_artefacts/Release/Standalone/Mastor Big Knob MBK-76.exe" out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath ../MBK-76-Windows.zip

      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ github.workspace }}/.github/scripts/instalador-windows.ps1 -Origem out -Produto "Mastor Big Knob MBK-76" -Sigla MBK-76 -Saida ../MBK-76-Windows-Instalador.exe

      - name: Conferir runtime embutido (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          python "${{ github.workspace }}/.github/scripts/conferir-runtime-windows.py" out

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/DubKnob_artefacts/Release/VST3/Mastor Big Knob MBK-76.vst3" out/
          cp -R "build/DubKnob_artefacts/Release/AU/Mastor Big Knob MBK-76.component" out/
          cp -R "build/DubKnob_artefacts/Release/Standalone/Mastor Big Knob MBK-76.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.app
          # ditto preserva permissões e assinatura dentro do zip
          cd out && ditto -c -k --sequesterRsrc . ../../MBK-76-macOS.zip

      - name: Instalador (macOS)
        if: runner.os == 'macOS'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/instalador-macos.sh" out "Mastor Big Knob MBK-76" MBK-76 ../MBK-76-macOS-Instalador.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: MBK-76-${{ matrix.name }}
          path: |
            MBK-76-${{ matrix.name }}.zip
            MBK-76-${{ matrix.name }}-Instalador.*

  # Release própria: MBK-76-<versão do CMakeLists>, criada/atualizada a cada push na main que mexa no plugin
  # (ou por tag MBK-76-x.y). Não vira a "latest", para não mexer nos links dos outros plugins.
  release:
    needs: build
    if: ${{ github.event_name != 'pull_request' && !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/MBK-76-') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            BigKnob/RELEASE_NOTES.md
            BigKnob/CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Versão
        id: ver
        run: |
          V=$(sed -n 's/^project(DubKnob VERSION \([0-9]*\.[0-9]*\).*/\1/p' BigKnob/CMakeLists.txt)
          echo "Versão do MBK-76: $V"
          test -n "$V"
          echo "tag=MBK-76-$V" >> "$GITHUB_OUTPUT"
          echo "name=Mastor Big Knob MBK-76 $V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: MBK-76-*
          merge-multiple: true

      - name: Conferir os arquivos
        run: |
          ls -la dist
          test -n "$(ls dist/*.zip 2>/dev/null)"
          test -n "$(ls dist/*-Instalador.exe 2>/dev/null)"
          test -n "$(ls dist/*-Instalador.pkg 2>/dev/null)"
          # o plugin do Windows não pode depender do Visual C++ Redistributable (senão não abre em PCs sem ele)
          d=$(mktemp -d); unzip -q dist/*-Windows.zip -d "$d"
          dll=$(find "$d" -path '*x86_64-win*' -type f | head -1)
          if objdump -p "$dll" | grep -iE 'DLL Name: (VCRUNTIME|MSVCP)'; then echo "::error::plugin depende do runtime do Visual C++"; exit 1; fi

      - uses: softprops/action-gh-release@v2
        if: ${{ inputs.tag == '' || inputs.tag == null }}
        with:
          tag_name: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.name }}
          files: |
            dist/*.zip
            dist/*-Instalador.exe
            dist/*-Instalador.pkg
          body_path: BigKnob/RELEASE_NOTES.md
          make_latest: 'false'
          overwrite_files: true

      # só anexa os zips a uma release que já existe
      - uses: softprops/action-gh-release@v2
        if: ${{ inputs.tag != '' && inputs.tag != null }}
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/*.zip
            dist/*-Instalador.exe
            dist/*-Instalador.pkg
