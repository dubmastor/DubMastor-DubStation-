name: Build Mastor Reggae Bass Machine MRBM-69

on:
  push:
    branches: [main]
    paths:
      - 'BassMachine/**'
      - 'DubBass/Source/BassVoice.h'
      - 'DubBass/Source/Maximizer.h'
      - 'DubDrums/Source/DrumSynth.h'
      - 'DubDrums/Source/PatternGenerator.h'
      - 'DubChords/Source/DubSynth.h'
      - 'RootsKeys/Source/RootsKeysEngine.h'
      - 'site/bassmachine/engine.js'
      - '.github/workflows/build-bassmachine.yml'
    tags:
      - 'MRBM-69-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que deve receber os instaladores (vazio = usa a versão do CMakeLists)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    working-directory: BassMachine

jobs:
  engine-test:
    name: Teste do motor de linhas de baixo (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar e rodar o teste (estilos, monofonia, notas presas)
        run: |
          g++ -std=c++17 -O2 -Wall tests/engine_test.cpp -o engine_test
          ./engine_test
      - name: Versão para navegador = plugin (site/bassmachine/engine.js, nota a nota)
        run: |
          g++ -std=c++17 -O2 -Wall tests/dump_engine.cpp -o dump_engine
          ./dump_engine book > book.json
          ./dump_engine lines > lines.json
          ./dump_engine drums > drums.json
          node tests/web_engine_test.js book.json lines.json drums.json

  build:
    needs: engine-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # --- Validação com pluginval (carrega o plugin, processa áudio, testa estado e interface)
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 600000 --validate "build/BassMachine_artefacts/Release/VST3/Mastor Reggae Bass Machine MRBM-69.vst3" 2>&1 | Tee-Object -Variable pvlog
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if ($code -ne 0) { exit 1 }

      - name: Check universal binary + validate (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3="build/BassMachine_artefacts/Release/VST3/Mastor Reggae Bass Machine MRBM-69.vst3"
          BIN="$VST3/Contents/MacOS/Mastor Reggae Bass Machine MRBM-69"
          echo "== Arquiteturas do binário"; lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64 && lipo -info "$BIN" | grep -q arm64
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 900000 --validate "$VST3"
          echo "== auval (validador da Apple para AU)"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/BassMachine_artefacts/Release/AU/Mastor Reggae Bass Machine MRBM-69.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu Mbm7 Dblb

      - name: Collect + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/BassMachine_artefacts/Release/VST3/Mastor Reggae Bass Machine MRBM-69.vst3" out/
          Copy-Item "build/BassMachine_artefacts/Release/Standalone/Mastor Reggae Bass Machine MRBM-69.exe" out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath ../MRBM-69-Windows.zip

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/BassMachine_artefacts/Release/VST3/Mastor Reggae Bass Machine MRBM-69.vst3" out/
          cp -R "build/BassMachine_artefacts/Release/AU/Mastor Reggae Bass Machine MRBM-69.component" out/
          cp -R "build/BassMachine_artefacts/Release/Standalone/Mastor Reggae Bass Machine MRBM-69.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.app
          cd out && ditto -c -k --sequesterRsrc . ../../MRBM-69-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MRBM-69-${{ matrix.name }}
          path: MRBM-69-${{ matrix.name }}.zip

  # Release própria: BassMachine-<versão do CMakeLists>, criada/atualizada a cada push na main que
  # mexa no Reggae Bass Machine (ou por tag MRBM-69-x.y). Não vira a "latest", para não mexer nos links
  # /releases/latest/download dos outros plugins.
  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/MRBM-69-') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            BassMachine/RELEASE_NOTES.md
            BassMachine/CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Versão
        id: ver
        run: |
          V=$(sed -n 's/^project(BassMachine VERSION \([0-9]*\.[0-9]*\).*/\1/p' BassMachine/CMakeLists.txt)
          echo "Versão do Reggae Bass Machine: $V"
          test -n "$V"
          echo "tag=MRBM-69-$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: MRBM-69-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          files: dist/*.zip
          body_path: BassMachine/RELEASE_NOTES.md
          make_latest: 'false'
