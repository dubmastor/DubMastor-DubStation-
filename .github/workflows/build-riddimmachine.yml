name: Build Mastor Riddim Machine MRM-0420

# O MRM-0420 usa o código do MRCM-1240 (DubChords), do MRDM-12 (DubDrums), do MRBM-69 (BassMachine, com os
# timbres do MRDBI-07 em DubBass) e do Mastor Big Knob (BigKnob) direto das pastas deles: quando qualquer um
# muda, o MRM-0420 é recompilado, testado e publicado também (sempre com os timbres e samples atuais).
on:
  push:
    branches: [main]
    paths:
      - 'RiddimMachine/**'
      - 'ReggaeChordMachine/Source/**'
      - 'ReggaeChordMachine/CMakeLists.txt'
      - 'DubDrumsMachine/Source/**'
      - 'DubDrumsMachine/Samples/**'
      - 'DubDrumsMachine/CMakeLists.txt'
      - 'ReggaeBassMachine/Source/**'
      - 'ReggaeBassMachine/CMakeLists.txt'
      - 'ReggaeDubBassInstrument/Source/**'
      - 'BigKnob/Source/**'
      - 'BigKnob/CMakeLists.txt'
      - 'RootsKeys/Source/**'
      - 'ReggaeChordMachine/Source/**'
      - 'DubDrumsMachine/Source/**'
      - 'RootsKeys/Source/RootsKeysEngine.h'
      - '.github/workflows/build-riddimmachine.yml'
      - '.github/scripts/**'
      - '.github/installer/**'
    tags:
      - 'MRM-0420-*'
  pull_request:
    paths:
      - 'RiddimMachine/**'
      - 'ReggaeChordMachine/Source/**'
      - 'DubDrumsMachine/Source/**'
      - 'RootsKeys/Source/RootsKeysEngine.h'
      - '.github/workflows/build-riddimmachine.yml'
      - '.github/scripts/**'
      - '.github/installer/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que deve receber os instaladores (vazio = só compilar)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    working-directory: RiddimMachine

jobs:
  render-test:
    name: Teste offline (5 abas, MIDI do riddim e de cada máquina, harmonia ligada, edições, intro alinhada, samples DM e estado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
                                  libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev

      - name: Compilar o teste
        run: |
          cmake -B build-test -DCMAKE_BUILD_TYPE=Release -DMRM_FORMATS=VST3 -DMRM_RENDER_TEST=ON -DJUCE_DIR="${{ github.workspace }}/JUCE"
          cmake --build build-test --target mrm_render --parallel 4

      - name: Rodar o teste
        run: |
          mkdir -p test-out && cd test-out
          R=../build-test/mrm_render_artefacts/Release/mrm_render
          $R riddim.png 0
          $R harmonia.png 1
          $R bateria.png 2
          $R baixo.png 3
          $R control-room.png 4
          $R alavanca.png 0 alavanca
          $R links
          $R samples
          $R edicao
          $R maquinas
          $R mute
          $R riddim.mid
          $R riddim-intro.mid intro
          $R play-riddim.wav intro
          $R daw-intro.wav intro
          $R estado
          $R inicial
          $R presets
          $R aleatorio

      - uses: actions/upload-artifact@v4
        with:
          name: MRM-0420-teste
          path: RiddimMachine/test-out

  build:
    needs: render-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # --- Validação com pluginval (carrega o plugin, processa áudio, testa estado e interface)
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --timeout-ms 900000 --validate "build/MastorRiddimMachine_artefacts/Release/VST3/Mastor Riddim Machine MRM-0420.vst3" 2>&1 | Tee-Object -Variable pvlog
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if ($code -ne 0) { exit 1 }

      # --- Validador oficial da Steinberg (conformidade VST3: Cubase, Studio One, Reaper, Ableton, FL Studio, Bitwig)
      - name: Validate VST3 with Steinberg validator (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          git clone --depth 1 --branch v3.7.14_build_55 https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          cd vst3sdk
          git submodule update --init --depth 1 base pluginterfaces public.sdk cmake
          Set-Content public.sdk/samples/vst-hosting/CMakeLists.txt "add_subdirectory(validator)"
          cmake -B build -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build build --config Release --target validator --parallel 4
          $v = Get-ChildItem -Recurse -Filter validator.exe build | Select-Object -First 1
          & $v.FullName "${{ github.workspace }}/RiddimMachine/build/MastorRiddimMachine_artefacts/Release/VST3/Mastor Riddim Machine MRM-0420.vst3" 2>&1 | Tee-Object -Variable vlog
          $code = $LASTEXITCODE
          $vlog | Select-String -Pattern "Failed|ERROR" -Context 6,0 | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { Write-Host "validator falhou: $code"; exit 1 }

      - name: Check universal binary + validate (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3="build/MastorRiddimMachine_artefacts/Release/VST3/Mastor Riddim Machine MRM-0420.vst3"
          BIN="$VST3/Contents/MacOS/Mastor Riddim Machine MRM-0420"
          echo "== Arquiteturas do binário"; lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64 && lipo -info "$BIN" | grep -q arm64
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --timeout-ms 1200000 --validate "$VST3"
          echo "== auval (validador da Apple para AU)"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/MastorRiddimMachine_artefacts/Release/AU/Mastor Riddim Machine MRM-0420.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu M420 Dblb

      - name: Collect + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/MastorRiddimMachine_artefacts/Release/VST3/Mastor Riddim Machine MRM-0420.vst3" out/
          Copy-Item -Recurse "build/MastorRiddimMachine_artefacts/Release/AAX/Mastor Riddim Machine MRM-0420.aaxplugin" out/
          Copy-Item "build/MastorRiddimMachine_artefacts/Release/Standalone/Mastor Riddim Machine MRM-0420.exe" out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath ../MRM-0420-Windows.zip

      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ github.workspace }}/.github/scripts/instalador-windows.ps1 -Origem out -Produto "Mastor Riddim Machine MRM-0420" -Sigla MRM-0420 -Saida ../MRM-0420-Windows-Instalador.exe

      - name: Conferir runtime embutido (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          python "${{ github.workspace }}/.github/scripts/conferir-runtime-windows.py" out

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/MastorRiddimMachine_artefacts/Release/VST3/Mastor Riddim Machine MRM-0420.vst3" out/
          cp -R "build/MastorRiddimMachine_artefacts/Release/AU/Mastor Riddim Machine MRM-0420.component" out/
          cp -R "build/MastorRiddimMachine_artefacts/Release/AAX/Mastor Riddim Machine MRM-0420.aaxplugin" out/
          cp -R "build/MastorRiddimMachine_artefacts/Release/Standalone/Mastor Riddim Machine MRM-0420.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.aaxplugin out/*.app
          (cd out && ditto -c -k --sequesterRsrc . ../../MRM-0420-macOS.zip)
          lipo -info "out/Mastor Riddim Machine MRM-0420.aaxplugin/Contents/MacOS/Mastor Riddim Machine MRM-0420"


      - name: Collect + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/MastorRiddimMachine_artefacts/Release/VST3/Mastor Riddim Machine MRM-0420.vst3" out/
          Copy-Item -Recurse "build/MastorRiddimMachine_artefacts/Release/AAX/Mastor Riddim Machine MRM-0420.aaxplugin" out/
          Copy-Item "build/MastorRiddimMachine_artefacts/Release/Standalone/Mastor Riddim Machine MRM-0420.exe" out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath ../MRM-0420-Windows.zip

      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ github.workspace }}/.github/scripts/instalador-windows.ps1 -Origem out -Produto "Mastor Riddim Machine MRM-0420" -Sigla MRM-0420 -Saida ../MRM-0420-Windows-Instalador.exe

      - name: Conferir runtime embutido (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          python "${{ github.workspace }}/.github/scripts/conferir-runtime-windows.py" out

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/MastorRiddimMachine_artefacts/Release/VST3/Mastor Riddim Machine MRM-0420.vst3" out/
          cp -R "build/MastorRiddimMachine_artefacts/Release/AU/Mastor Riddim Machine MRM-0420.component" out/
          cp -R "build/MastorRiddimMachine_artefacts/Release/AAX/Mastor Riddim Machine MRM-0420.aaxplugin" out/
          cp -R "build/MastorRiddimMachine_artefacts/Release/Standalone/Mastor Riddim Machine MRM-0420.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.aaxplugin out/*.app
          (cd out && ditto -c -k --sequesterRsrc . ../../MRM-0420-macOS.zip)
          lipo -info "out/Mastor Riddim Machine MRM-0420.aaxplugin/Contents/MacOS/Mastor Riddim Machine MRM-0420"

          # Instalador .pkg: VST3 e AU em /Library/Audio/Plug-Ins (Logic, GarageBand, FL Studio, Cubase,
          # Ableton, Reaper...), AAX em /Library/Application Support/Avid/Audio/Plug-Ins (Pro Tools) e o app
          # em /Applications; o postinstall tira a quarentena e relê os Audio Units
          V=$(sed -n 's/^project(MastorRiddimMachine VERSION \([0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          AVID="pkgroot/Library/Application Support/Avid/Audio/Plug-Ins"
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Library/Audio/Plug-Ins/Components "$AVID" pkgroot/Applications
          cp -R out/*.vst3 pkgroot/Library/Audio/Plug-Ins/VST3/
          cp -R out/*.component pkgroot/Library/Audio/Plug-Ins/Components/
          cp -R out/*.aaxplugin "$AVID/"
          cp -R out/*.app pkgroot/Applications/
          # sem "relocate": senão o macOS instala em cima de outra cópia achada no disco
          pkgbuild --analyze --root pkgroot component.plist
          plutil -convert xml1 component.plist
          sed -i '' -e '/<key>BundleIsRelocatable<\/key>/{n;s/<true\/>/<false\/>/;}' component.plist
          ! grep -A1 "BundleIsRelocatable" component.plist | grep -q "<true/>"
          pkgbuild --root pkgroot --component-plist component.plist --identifier com.dubmastor.mrm0420.pkg --version "$V" \
                   --scripts installer/macos-scripts --install-location / \
                   ../MRM-0420-macOS-Instalador.pkg
          pkgutil --payload-files ../MRM-0420-macOS-Instalador.pkg | grep -E "\.vst3$|\.component$|\.aaxplugin$|\.app$"
          # instala o .pkg de verdade e confere o que as DAWs vão achar
          sudo installer -pkg ../MRM-0420-macOS-Instalador.pkg -target /
          test -d "/Library/Audio/Plug-Ins/VST3/Mastor Riddim Machine MRM-0420.vst3"
          test -d "/Library/Audio/Plug-Ins/Components/Mastor Riddim Machine MRM-0420.component"
          test -d "/Library/Application Support/Avid/Audio/Plug-Ins/Mastor Riddim Machine MRM-0420.aaxplugin"
          test -d "/Applications/Mastor Riddim Machine MRM-0420.app"
          ! xattr -p com.apple.quarantine "/Library/Audio/Plug-Ins/VST3/Mastor Riddim Machine MRM-0420.vst3" 2>/dev/null
          rm -rf ~/Library/Audio/Plug-Ins/Components/"Mastor Riddim Machine MRM-0420.component"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu M420 Dblb

      - name: Instalador (macOS)
        if: runner.os == 'macOS'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/instalador-macos.sh" out "Mastor Riddim Machine MRM-0420" MRM-0420 ../MRM-0420-macOS-Instalador.pkg

      # instala o .pkg de verdade e confere o que as DAWs vão achar
      - name: Testar o instalador (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg ../MRM-0420-macOS-Instalador.pkg -target /
          test -d "/Library/Audio/Plug-Ins/VST3/Mastor Riddim Machine MRM-0420.vst3"
          test -d "/Library/Audio/Plug-Ins/Components/Mastor Riddim Machine MRM-0420.component"
          test -d "/Library/Application Support/Avid/Audio/Plug-Ins/Mastor Riddim Machine MRM-0420.aaxplugin"
          ! xattr -p com.apple.quarantine "/Library/Audio/Plug-Ins/VST3/Mastor Riddim Machine MRM-0420.vst3" 2>/dev/null
          rm -rf ~/Library/Audio/Plug-Ins/Components/"Mastor Riddim Machine MRM-0420.component"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu M420 Dblb

      - uses: actions/upload-artifact@v4
        with:
          name: MRM-0420-${{ matrix.name }}
          path: |
            MRM-0420-${{ matrix.name }}.zip
            MRM-0420-${{ matrix.name }}-Instalador.*

  # Release própria: MRM-0420-<versão do CMakeLists>, criada/atualizada a cada push na main que mexa
  # no MRM-0420 (ou por tag MRM-0420-x.y). Não vira a "latest", para não mexer nos links
  # /releases/latest/download dos outros plugins.
  release:
    needs: build
    if: ${{ github.event_name != 'pull_request' && !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/MRM-0420-') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RiddimMachine/RELEASE_NOTES.md
            RiddimMachine/CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Versão
        id: ver
        run: |
          V=$(sed -n 's/^project(MastorRiddimMachine VERSION \([0-9]*\.[0-9]*\).*/\1/p' RiddimMachine/CMakeLists.txt)
          echo "Versão do MRM-0420: $V"
          test -n "$V"
          echo "tag=MRM-0420-$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: MRM-0420-*
          merge-multiple: true

      - name: Só os instaladores
        run: ls dist && rm -f dist/*.png dist/*.wav dist/*.mid

      - name: Conferir os arquivos
        run: |
          ls -la dist
          test -n "$(ls dist/*.zip 2>/dev/null)"
          test -n "$(ls dist/*-Instalador.exe 2>/dev/null)"
          test -n "$(ls dist/*-Instalador.pkg 2>/dev/null)"
          # o plugin do Windows não pode depender do Visual C++ Redistributable (senão não abre em PCs sem ele)
          d=$(mktemp -d); unzip -q dist/*-Windows.zip -d "$d"
          dll=$(find "$d" -path '*x86_64-win*' -type f | head -1)
          if objdump -p "$dll" | grep -iE 'DLL Name: (VCRUNTIME|MSVCP)'; then echo "::error::plugin depende do runtime do Visual C++"; exit 1; fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('Mastor Riddim Machine {0}', steps.ver.outputs.tag) }}
          files: |
            dist/*.zip
            dist/*-Instalador.exe
            dist/*-Instalador.pkg
          body_path: RiddimMachine/RELEASE_NOTES.md
          make_latest: 'false'
