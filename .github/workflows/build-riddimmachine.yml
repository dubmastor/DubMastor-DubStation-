name: Build Mastor Riddim Machine MRM-0420

# O MRM-0420 usa o código do Dub Chords e do Dub Drums direto das pastas deles:
# quando um dos dois muda, o MRM-0420 é recompilado e testado também.
on:
  push:
    branches: [main]
    paths:
      - 'RiddimMachine/**'
      - 'ReggaeChordMachine/Source/**'
      - 'DubDrumsMachine/Source/**'
      - 'RootsKeys/Source/RootsKeysEngine.h'
      - '.github/workflows/build-riddimmachine.yml'
    tags:
      - 'MRM-0420-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release que deve receber os instaladores (vazio = só compilar)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    working-directory: RiddimMachine

jobs:
  render-test:
    name: Teste offline (abas, MIDI do riddim, intro alinhada, PLAY RIDDIM e estado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
                                  libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev

      - name: Compilar o teste
        run: |
          cmake -B build-test -DCMAKE_BUILD_TYPE=Release -DMRM_FORMATS=VST3 -DMRM_RENDER_TEST=ON -DJUCE_DIR="${{ github.workspace }}/JUCE"
          cmake --build build-test --target mrm_render --parallel 4

      - name: Rodar o teste
        run: |
          mkdir -p test-out && cd test-out
          R=../build-test/mrm_render_artefacts/Release/mrm_render
          $R harmonia.png 0
          $R bateria.png 1
          $R riddim.mid
          $R riddim-intro.mid intro
          $R play-riddim.wav intro
          $R daw-intro.wav intro
          $R estado

      - uses: actions/upload-artifact@v4
        with:
          name: MRM-0420-teste
          path: RiddimMachine/test-out

  build:
    needs: render-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout JUCE 8.0.4
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="${{ github.workspace }}/JUCE"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # --- Validação com pluginval (carrega o plugin, processa áudio, testa estado e interface)
      - name: Validate VST3 with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 600000 --validate "build/MastorRiddimMachine_artefacts/Release/VST3/Mastor Riddim Machine MRM-0420.vst3" 2>&1 | Tee-Object -Variable pvlog
          $code = $LASTEXITCODE
          Write-Host "pluginval exit code: $code"
          if ($code -ne 0) { exit 1 }

      - name: Check universal binary + validate (macOS)
        if: runner.os == 'macOS'
        run: |
          VST3="build/MastorRiddimMachine_artefacts/Release/VST3/Mastor Riddim Machine MRM-0420.vst3"
          BIN="$VST3/Contents/MacOS/Mastor Riddim Machine MRM-0420"
          echo "== Arquiteturas do binário"; lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64 && lipo -info "$BIN" | grep -q arm64
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 900000 --validate "$VST3"
          echo "== auval (validador da Apple para AU)"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/MastorRiddimMachine_artefacts/Release/AU/Mastor Riddim Machine MRM-0420.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aumu M420 Dblb

      - name: Collect + package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/MastorRiddimMachine_artefacts/Release/VST3/Mastor Riddim Machine MRM-0420.vst3" out/
          Copy-Item "build/MastorRiddimMachine_artefacts/Release/Standalone/Mastor Riddim Machine MRM-0420.exe" out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath ../MRM-0420-Windows.zip

      - name: Collect + package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp -R "build/MastorRiddimMachine_artefacts/Release/VST3/Mastor Riddim Machine MRM-0420.vst3" out/
          cp -R "build/MastorRiddimMachine_artefacts/Release/AU/Mastor Riddim Machine MRM-0420.component" out/
          cp -R "build/MastorRiddimMachine_artefacts/Release/Standalone/Mastor Riddim Machine MRM-0420.app" out/
          # assinatura ad-hoc para o macOS aceitar o plugin localmente
          codesign --force --deep -s - out/*.vst3 out/*.component out/*.app
          cd out && ditto -c -k --sequesterRsrc . ../../MRM-0420-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MRM-0420-${{ matrix.name }}
          path: MRM-0420-${{ matrix.name }}.zip

  # Release própria: MRM-0420-<versão do CMakeLists>, criada/atualizada a cada push na main que mexa
  # no MRM-0420 (ou por tag MRM-0420-x.y). Não vira a "latest", para não mexer nos links
  # /releases/latest/download dos outros plugins.
  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/MRM-0420-') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RiddimMachine/RELEASE_NOTES.md
            RiddimMachine/CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Versão
        id: ver
        run: |
          V=$(sed -n 's/^project(MastorRiddimMachine VERSION \([0-9]*\.[0-9]*\).*/\1/p' RiddimMachine/CMakeLists.txt)
          echo "Versão do MRM-0420: $V"
          test -n "$V"
          echo "tag=MRM-0420-$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: MRM-0420-*
          merge-multiple: true

      - name: Só os instaladores
        run: ls dist && rm -f dist/*.png dist/*.wav dist/*.mid

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('Mastor Riddim Machine {0}', steps.ver.outputs.tag) }}
          files: dist/*.zip
          body_path: RiddimMachine/RELEASE_NOTES.md
          make_latest: 'false'
